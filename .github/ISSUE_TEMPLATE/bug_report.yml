name: Bug report
description: Report a reproducible compression problem.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    attributes:
      label: What happened?
      description: Include expected and actual behavior.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Reproduction
      description: Include minimal code, input format, Flutter version, OS, and device.
    validations:
      required: true
